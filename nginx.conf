# Docker's embedded DNS; re-resolve "api" every few seconds so scaling up/down is picked up
# without restarting the gateway.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $api_upstream http://api:8080;   # a variable forces per-request DNS resolution
        proxy_pass $api_upstream;

        # never hang on a replica that just disappeared: fail fast and try another one
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By $upstream_addr always;   # shows which instance answered
    }
}
