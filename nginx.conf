upstream api {
    server api:8080;          # Docker DNS returns every replica; nginx round-robins them
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By $upstream_addr always;   # shows which instance answered
    }
}
